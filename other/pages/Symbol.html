<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Symbol</title>

    <style>
        html {
            background-color: #ffffff;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 5px;
            grid-auto-rows: 200px;
            margin: 1rem 3rem;
            counter-reset: num;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="item1">
            <div class="bullets1">项目符号</div>
            <style>
                .bullets1 {
                    position: relative;
                    padding-left: 4px;
                    margin-bottom: 10px;
                }

                .bullets1::before {
                    position: relative;
                    left: -4px;
                    content: "";
                    border-right: 2px solid #3f89a7;
                }
            </style>
        </div>
        <div class="item2">
            <div class="bullets2">项目符号</div>
            <style>
                .bullets2 {
                    position: relative;
                    padding-left: 15px;
                    margin-bottom: 5px;
                }

                .bullets2::before {
                    content: "●";
                    position: absolute;
                    left: 0;
                    top: 0;
                    font-size: 16px;
                    color: red;
                }
            </style>
        </div>
    </div>
</body>

</html>
