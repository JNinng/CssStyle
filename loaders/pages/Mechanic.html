			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
			gap: 5px;
			grid-auto-rows: 200px;
			margin: 1rem 3rem;

				}

				.loader1:after {
					content: "";
					grid-area: 1/1;
				}

					background: #C0C0C0;
					transform: rotate(0turn) translate(15.625%) rotate(0turn);
					animation: l1 2s linear infinite;
				}

				@keyframes l1 {
					to {
