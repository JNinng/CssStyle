<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Wavy</title>

	<style>
		html {
			background-color: #575757;
		}

		.container {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
			gap: 5px;
			grid-auto-rows: 200px;
			margin: 1rem 3rem;
			counter-reset: num;
		}
	</style>
</head>

<body>
	<div class="container">
		<div class="loader1">
			<style>
				.loader1 {
					height: 30px;
					aspect-ratio: 6;
					--c: #0000 64%, #000 66% 98%, #0000 101%;
					background:
						radial-gradient(35% 146% at 50% 159%, var(--c)) 0 0,
						radial-gradient(35% 146% at 50% -59%, var(--c)) 25% 100%;
					background-size: calc(100%/3) 50%;
					background-repeat: repeat-x;
					animation: l1 1s infinite linear;
				}

				@keyframes l1 {
					to {
						background-position: 50% 0, 75% 100%
					}
				}
			</style>
		</div>
		<div class="loader2">
			<style>
				.loader2 {
					height: 30px;
					aspect-ratio: 6;
					--c: #0000 64%, #000 66% 98%, #0000 101%;
					background:
						radial-gradient(35% 146% at 50% 159%, var(--c)) 0 0,
						radial-gradient(35% 146% at 50% -59%, var(--c)) 25% 100%;
					background-size: calc(100%/3) 50%;
					background-repeat: repeat-x;
					clip-path: inset(0 100% 0 0);
					animation: l2 1s infinite linear;
				}

				@keyframes l2 {

					90%,
					to {
						clip-path: inset(0)
					}
				}
			</style>
		</div>
		<div class="loader3">
			<style>
				.loader3 {
					height: 30px;
					aspect-ratio: 6;
					--c: #0000 64%, #000 66% 98%, #0000 101%;
					background:
						radial-gradient(35% 146% at 50% 159%, var(--c)) 0 0,
						radial-gradient(35% 146% at 50% -59%, var(--c)) 25% 100%;
					background-size: calc(100%/3) 50%;
					background-repeat: repeat-x;
					clip-path: inset(0 50%);
					animation: l3 1s infinite linear;
				}

				@keyframes l3 {

					90%,
					to {
						clip-path: inset(0)
					}
				}
			</style>
		</div>
		<div class="loader4">
			<style>
				.loader4 {
					height: 27px;
					aspect-ratio: 5;
					--c: #000 90deg, #0000 0;
					background:
						conic-gradient(from 135deg at top, var(--c)),
						conic-gradient(from -45deg at bottom, var(--c)) 12.5% 100%;
					background-size: 20% 50%;
					background-repeat: repeat-x;
					clip-path: inset(0 100% 0 0);
					animation:
						l4-0 1s infinite linear,
						l4-1 2s infinite steps(1);
				}

				@keyframes l4-0 {
					to {
						clip-path: inset(0)
					}
				}

				@keyframes l4-1 {
					50% {
						scale: -1 1
					}
				}
			</style>
		</div>
		<div class="loader5">
			<style>
				.loader5 {
					height: 27px;
					aspect-ratio: 5;
					--c: #000 90deg, #0000 0;
					background:
						conic-gradient(from 135deg at top, var(--c)),
						conic-gradient(from -45deg at bottom, var(--c)) 12.5% 100%;
					background-size: 20% 50%;
					background-repeat: repeat-x;
					clip-path: inset(0 60% 0 0);
					animation: l5 .8s infinite linear alternate;
				}

				@keyframes l5 {
					to {
						clip-path: inset(0 0 0 60%)
					}
				}
			</style>
		</div>
		<div class="loader6">
			<style>
				.loader6 {
					height: 30px;
					aspect-ratio: 6;
					--c: #0000 64%, #000 66% 98%, #0000 101%;
					background:
						radial-gradient(35% 146% at 50% 159%, var(--c)) 0 0,
						radial-gradient(35% 146% at 50% -59%, var(--c)) 25% 100%;
					background-size: calc(100%/3) 50%;
					background-repeat: repeat-x;
					clip-path: inset(0 60% 0 0);
					animation: l6 .8s infinite linear alternate;
				}

				@keyframes l6 {
					to {
						clip-path: inset(0 0 0 60%)
					}
				}
			</style>
		</div>
		<div class="loader7">
			<style>
				.loader7 {
					display: inline-grid;
				}

				.loader7:before,
				.loader7:after {
					content: "";
					height: 27px;
					aspect-ratio: 5;
					--c: #000 90deg, #0000 0;
					background:
						conic-gradient(from 135deg at top, var(--c)),
						conic-gradient(from -45deg at bottom, var(--c)) 12.5% 100%;
					background-size: 20% 50%;
					background-repeat: repeat-x;
					clip-path: inset(0 60% 0 0);
					animation: l7 .8s infinite linear alternate;
				}

				.loader7:after {
					animation-direction: alternate-reverse;
				}

				@keyframes l7 {
					to {
						clip-path: inset(0 0 0 60%)
					}
				}
			</style>
		</div>
		<div class="loader8">
			<style>
				.loader8 {
					display: inline-grid;
				}

				.loader8:before,
				.loader8:after {
					content: "";
					grid-area: 1/1;
					height: 30px;
					aspect-ratio: 6;
					--c: #0000 64%, #000 66% 98%, #0000 101%;
					background:
						radial-gradient(35% 146% at 50% 159%, var(--c)) 0 0,
						radial-gradient(35% 146% at 50% -59%, var(--c)) 25% 100%;
					background-size: calc(100%/3) 50%;
					background-repeat: repeat-x;
					-webkit-mask: repeating-linear-gradient(90deg, #000 0 15%, #0000 0 50%) 0 0/200%;
					animation: l8 .8s infinite linear;
				}

				.loader8:after {
					scale: -1;
				}

				@keyframes l8 {
					to {
						-webkit-mask-position: -100% 0
					}
				}
			</style>
		</div>
		<div class="loader9">
			<style>
				.loader9 {
					display: inline-grid;
				}

				.loader9:before,
				.loader9:after {
					content: "";
					grid-area: 1/1;
					height: 30px;
					aspect-ratio: 6;
					--c: #0000 64%, #000 66% 98%, #0000 101%;
					background:
						radial-gradient(35% 146% at 50% 159%, var(--c)) 0 0,
						radial-gradient(35% 146% at 50% -59%, var(--c)) 25% 100%;
					background-size: calc(100%/3) 50%;
					background-repeat: repeat-x;
					-webkit-mask: repeating-linear-gradient(90deg, #000 0 15%, #0000 0 50%) 0 0/200%;
					animation: l9 .8s infinite linear;
				}

				.loader9:after {
					scale: 1 -1;
					animation-delay: -.2s;
				}

				@keyframes l9 {
					to {
						-webkit-mask-position: -100% 0
					}
				}
			</style>
		</div>
		<div class="loader10">
			<style>
				.loader10 {
					display: inline-grid;
				}

				.loader10:before,
				.loader10:after {
					content: "";
					grid-area: 1/1;
					height: 30px;
					aspect-ratio: 6;
					--c: #0000 64%, #000 66% 98%, #0000 101%;
					background:
						radial-gradient(35% 146% at 50% 159%, var(--c)) 0 0,
						radial-gradient(35% 146% at 50% -59%, var(--c)) 25% 100%;
					background-size: calc(100%/3) 50%;
					background-repeat: repeat-x;
					clip-path: inset(0 100% 0 0);
					animation: l10 1.5s infinite linear;
				}

				.loader10:after {
					scale: -1;
				}

				@keyframes l10 {
					50% {
						clip-path: inset(0)
					}

					to {
						clip-path: inset(0 0 0 100%)
					}
				}
			</style>
		</div>
		<div class="loader11">
			<style>
				.loader11 {
					display: inline-grid;
					padding: 5px;
					background: #fff;
					filter: blur(4px) contrast(12);
				}

				.loader11:before {
					content: "";
					height: 40px;
					aspect-ratio: 3;
					--c: #0000 64%, #000 66% 98%, #0000 101%;
					background:
						radial-gradient(35% 146% at 50% 159%, var(--c)) 0 0,
						radial-gradient(35% 146% at 50% -59%, var(--c)) 100% 100%;
					background-size: calc(200%/3) 50%;
					background-repeat: repeat-x;
					animation: l11 .8s infinite linear;
				}

				@keyframes l11 {
					to {
						background-position: -200% 0, -100% 100%
					}
				}
			</style>
		</div>
		<div class="loader12">
			<style>
				.loader12 {
					display: inline-grid;
					padding: 5px;
					background: #fff;
					filter: blur(4px) contrast(12);
				}

				.loader12:before {
					content: "";
					height: 40px;
					aspect-ratio: 3;
					--c: #0000 64%, #000 66% 98%, #0000 101%;
					background:
						radial-gradient(35% 146% at 50% 159%, var(--c)) 0 0,
						radial-gradient(35% 146% at 50% -59%, var(--c)) 100% 100%;
					background-size: calc(200%/3) 50%;
					background-repeat: repeat-x;
					-webkit-mask: repeating-linear-gradient(90deg, #000 0 10%, #0000 0 20%);
					animation: l12 .8s infinite linear;
				}

				@keyframes l12 {
					to {
						background-position: -200% 0, -100% 100%
					}
				}
			</style>
		</div>
		<div class="loader13">
			<style>
				.loader13 {
					display: inline-grid;
					padding: 5px;
					background: #fff;
					filter: blur(4px) contrast(12);
				}

				.loader13:before,
				.loader13:after {
					content: "";
					grid-area: 1/1;
					height: 40px;
					aspect-ratio: 3;
					--c: #0000 64%, #000 66% 98%, #0000 101%;
					background:
						radial-gradient(35% 146% at 50% 159%, var(--c)) 0 0,
						radial-gradient(35% 146% at 50% -59%, var(--c)) 100% 100%;
					background-size: calc(200%/3) 50%;
					background-repeat: repeat-x;
				}

				.loader13:before {
					-webkit-mask: repeating-linear-gradient(90deg, #000 0 8%, #0000 0 15%);
				}

				.loader13:after {
					clip-path: inset(0 100% 0 0);
					animation: l13 1.5s infinite linear;
				}

				@keyframes l13 {
					50% {
						clip-path: inset(0)
					}

					to {
						clip-path: inset(0 0 0 100%)
					}
				}
			</style>
		</div>
		<div class="loader14">
			<style>
				.loader14 {
					display: inline-grid;
					padding: 5px;
					background: #fff;
					filter: blur(4px) contrast(12);
				}

				.loader14:before,
				.loader14:after {
					content: "";
					grid-area: 1/1;
					height: 40px;
					aspect-ratio: 3;
					--c: #0000 64%, #000 66% 98%, #0000 101%;
					background:
						radial-gradient(35% 146% at 50% 159%, var(--c)) 0 0,
						radial-gradient(35% 146% at 50% -59%, var(--c)) 100% 100%;
					background-size: calc(200%/3) 50%;
					background-repeat: repeat-x;
					clip-path: inset(0 100% 0 0);
					-webkit-mask: repeating-linear-gradient(90deg, #000 0 10%, #0000 0 20%);
					animation: l14 1.5s infinite linear;
				}

				.loader14:after {
					scale: -1;
				}

				@keyframes l14 {

					40%,
					60% {
						clip-path: inset(0)
					}

					to {
						clip-path: inset(0 0 0 100%)
					}
				}
			</style>
		</div>
	</div>
</body>

</html>
